<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floorball Training // Übungen als PDF</title>
<meta name="description" content="Floorball-Übungen zum Ausdrucken für Trainer und Übungsleiter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Anton"; src: url("Anton.woff2"); }
  :root { --bg: #0c0c0c; --fg: #f4f4f4; --mute: #9a9a9a; --line: rgba(255,255,255,.18); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; text-transform: uppercase; font-size: 12px; letter-spacing: .03em; color: var(--mute); }
  header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 12px; font-weight: 800; text-transform: uppercase; font-size: 13px; }
  h1, h2 { font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; line-height: .95; margin: 0; }
  h1 { font-size: clamp(44px, 11vw, 96px); margin: 28px 0 8px; }
  h1 b { color: var(--mute); font-weight: 400; }
  .lead { max-width: 560px; color: #cfcfcf; line-height: 1.5; margin: 0 0 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { display: block; color: inherit; text-decoration: none; border: 1px solid var(--line); background: #151515; }
  .card img { display: block; width: 100%; aspect-ratio: 210/150; object-fit: cover; object-position: top; background: #fff; }
  .meta { padding: 14px 16px 16px; }
  .meta h2 { font-size: 28px; margin: 6px 0 10px; }
  .meta ul { list-style: none; padding: 0; margin: 0 0 14px; display: flex; gap: 16px; }
  .meta li span { display: block; font-size: 10px; }
  .meta li { color: var(--fg); }
  .btn { display: inline-block; background: var(--fg); color: var(--bg); font-weight: 800; text-transform: uppercase; font-size: 13px; padding: 8px 14px; }
  .card:hover .btn { background: #fff; }
  footer { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 12px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="wrap">
  <header><span>// Floorball Training</span><span class="mono">0 Übungen</span></header>
  <h1>Übungen <b>//</b> als PDF</h1>
  <p class="lead">Jede Übung aus den Reels als Übungsblatt zum Ausdrucken: Aufbau, Ablauf, Tipps und Steigerung. Kostenlos für Trainer und Übungsleiter.</p>
  <div class="grid"><p class="lead">Die ersten Übungsblätter erscheinen hier, sobald das Reel online ist.</p>
  </div>
  <footer class="mono"><span>Übung des Tages</span><span>@floorball_uebungen</span></footer>
</div>
</body>
</html>
